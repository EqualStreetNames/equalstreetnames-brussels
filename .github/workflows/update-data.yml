name: Update data

on:
  # Run every month on the 1st at 1:00 UTC
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/update-data.yml"
      - "config.php"
      - "data.csv"
      - "overpass/*"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/update-data.yml"
      - "config.php"
      - "data.csv"
      - "overpass/*"

jobs:
  # update-data:
  #   uses: EqualStreetNames/equalstreetnames/.github/workflows/reusable-update-date.yml@master
  #   secrets: inherit
  #   with:
  #     city: belgium/brussels

  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # concurrency:
    #   group: update-belgium/brussels
    #   cancel-in-progress: true
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/equalstreetnames
          token: ${{ steps.app-token.outputs.token }}
      - name: Update sub-modules
        run: git submodule update --init --remote --merge process cities/belgium/brussels
      - name: Validate composer.json and composer.lock
        working-directory: process
        run: composer validate
      - name: Install dependencies
        working-directory: process
        run: composer install --prefer-dist --no-progress
      - name: Checkout submodule to master
        working-directory: cities/belgium/brussels
        run: git checkout -q master
      - name: Normalize `data.csv` file
        working-directory: process
        run: php process.php tool:normalize-csv --city=belgium/brussels
      - name: Run update
        working-directory: process
        run: composer run update-data -- --city=belgium/brussels
      - name: Git status
        working-directory: cities/belgium/brussels
        run: git status
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: data
          path: |
            cities/belgium/brussels/data.csv
            cities/belgium/brussels/data/*.csv
            cities/belgium/brussels/data/*.geojson
            cities/belgium/brussels/data/*.json
          if-no-files-found: ignore

  push-data-upstream:
    runs-on: ubuntu-latest
    needs: update-data
    permissions:
      contents: write
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/equalstreetnames
          token: ${{ steps.app-token.outputs.token }}
      - name: Update sub-modules
        run: git submodule update --init --remote --merge cities/belgium/brussels
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: data
          path: cities/belgium/brussels/
      - name: Git configuration
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Verify sub-module changes
        working-directory: cities/belgium/brussels
        run: git status
      - name: Commit & Push sub-module
        working-directory: cities/belgium/brussels
        run: |
          git add -A
          git commit -m "🗃 Update data" || echo "No changes to commit"
          git push origin HEAD:master
      - name: Verify main repository changes
        run: git status
      - name: Commit & Push main repository
        run: |
          git add cities/belgium/brussels
          git commit -m "🗃 Update belgium/brussels sub-module" || echo "No changes to commit"
          git push origin HEAD:master
