name: Update data

on:
  # Run every month on the 1st at 1:00 UTC
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/update-data.yml"
      - "config.php"
      - "data.csv"
      - "overpass/*"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/update-data.yml"
      - "config.php"
      - "data.csv"
      - "overpass/*"

jobs:
  update-data:
    uses: EqualStreetNames/equalstreetnames/.github/workflows/reusable-update-data.yml@master
    secrets: inherit
    with:
      city: belgium/brussels
